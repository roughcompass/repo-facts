name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Publishes the committed version of every package, after running all
      # gates again from a clean clone of this commit.
      - run: npm run release:publish
        env:
          REPO_FACTS_NPM_REGISTRY: ${{ vars.REPO_FACTS_NPM_REGISTRY }}
          REPO_FACTS_NPM_TOKEN: ${{ secrets.REPO_FACTS_NPM_TOKEN }}
