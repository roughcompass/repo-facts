name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Publishes the committed version of every package, after running all
      # gates again from a clean clone of this commit.
      - run: npm run release:publish
        # The deprecated REPO_FACTS_NPM_REGISTRY and REPO_FACTS_NPM_TOKEN names are read for one more release.
        env:
          SURVEYOR_NPM_REGISTRY: ${{ vars.SURVEYOR_NPM_REGISTRY || vars.REPO_FACTS_NPM_REGISTRY }}
          SURVEYOR_NPM_TOKEN: ${{ secrets.SURVEYOR_NPM_TOKEN || secrets.REPO_FACTS_NPM_TOKEN }}
