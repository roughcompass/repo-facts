format: 1
rules:
  - id: services.substitute.msw-handler
    version: 1
    description: A Mock Service Worker request handler
    match: { call: { module: msw, members: [http], method: [get, post, put, patch, delete, head, options, all] } }
    capture:
      url: { argument: 0 }
    emit: { signal: { kind: request-interceptor } }

  - id: services.substitute.msw-rest-handler
    version: 1
    description: A Mock Service Worker request handler written with the legacy rest namespace
    match: { call: { module: msw, members: [rest], method: [get, post, put, patch, delete, head, options, all] } }
    capture:
      url: { argument: 0 }
    emit: { signal: { kind: request-interceptor } }

  - id: services.substitute.msw-graphql-handler
    version: 1
    description: A Mock Service Worker GraphQL operation handler
    match: { call: { module: msw, members: [graphql], method: [query, mutation, operation] } }
    capture:
      operation: { argument: 0 }
    emit: { signal: { kind: graphql-interceptor } }

  - id: services.substitute.msw-server
    version: 1
    description: A Mock Service Worker server or worker
    match: { call: { module: [msw, msw/node, msw/browser], method: [setupServer, setupWorker] } }
    emit: { signal: { kind: mock-server } }

  - id: services.substitute.nock
    version: 1
    description: A nock interceptor for an origin
    match: { call: { module: nock } }
    capture:
      url: { argument: 0 }
    emit: { signal: { kind: request-interceptor } }

  - id: services.substitute.mock-server-library
    version: 1
    description: A mock server library
    match: { import: { module: [miragejs, json-server, "@mswjs/data", pretender] } }
    capture:
      module: { module: true }
    emit: { signal: { kind: mock-server } }

  - id: services.substitute.vitest-module-mock
    version: 1
    description: A module replaced with vi.mock
    match: { call: { module: vitest, members: [vi], method: [mock, doMock] } }
    capture:
      module: { argument: 0 }
    emit: { signal: { kind: module-mock } }

  - id: services.substitute.global-module-mock
    version: 1
    description: A module replaced with a global vi.mock or jest.mock
    match: { call: { anyReceiver: true, method: [mock, doMock] } }
    capture:
      module: { argument: 0 }
    where: [{ capture: module, is: string }]
    emit: { signal: { kind: module-mock-candidate } }

  - id: services.substitute.vitest-stub-global
    version: 1
    description: A global replaced with vi.stubGlobal
    match: { call: { anyReceiver: true, method: [stubGlobal] } }
    capture:
      name: { argument: 0 }
    where: [{ capture: name, equals: fetch }]
    emit: { signal: { kind: fetch-stub } }

  - id: services.substitute.jest-spy-fetch
    version: 1
    description: The global fetch replaced with jest.spyOn or vi.spyOn
    match: { call: { anyReceiver: true, method: [spyOn] } }
    capture:
      name: { argument: 1 }
    where: [{ capture: name, equals: fetch }]
    emit: { signal: { kind: fetch-stub } }

  - id: services.egress.vite-proxy
    version: 1
    description: Development proxy routes in a Vite configuration
    match: { call: { module: vite, members: [defineConfig] } }
    capture:
      proxy: { argument: 0, property: [server, proxy] }
    where: [{ capture: proxy, is: [object, unresolved] }]
    emit: { signal: { kind: dev-proxy } }

  - id: services.egress.proxy-middleware
    version: 1
    description: A route proxied with http-proxy-middleware
    match: { call: { module: http-proxy-middleware, members: [createProxyMiddleware] } }
    capture:
      first: { argument: 0 }
      options: { argument: 1 }
    emit: { signal: { kind: proxy-middleware } }

  - id: services.access.auth-library
    version: 1
    description: An authentication library
    match: { import: { module: ["@azure/msal-browser", "@azure/msal-react", "@azure/msal-node", oidc-client-ts, oidc-client, keycloak-js, next-auth, "next-auth/react", "@auth0/auth0-react", "@auth0/auth0-spa-js", "@okta/okta-auth-js", "@okta/okta-react", "firebase/auth", aws-amplify, "@aws-amplify/auth"] } }
    capture:
      module: { module: true }
    emit: { signal: { kind: auth-library } }
